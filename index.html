    /* Penjaga awal: halaman tidak boleh kosong tanpa penjelasan.

    (function () {
      var failed = (window.__bootFailedLibs = []);
      var errors = (window.__bootErrors = []);
      window.__appBooted = false;
      window.__bootBusy = false;
      var timer = null;

      function rootHasApp() {
        var r = document.getElementById('root');
        if (!r) return false;
        for (var i = 0; i < r.children.length; i++) {
          if (r.children[i].id !== 'boot-loading' && r.children[i].id !== 'boot-error') return true;
        }
        return false;
      }
      function el(tag, css, text) {
        var e = document.createElement(tag);
        if (css) e.style.cssText = css;
        if (text) e.textContent = text;
        return e;
      }
      function has(v) { return typeof v !== 'undefined' && v ? 'OK' : 'TIDAK TERSEDIA'; }
      function showPanel(reason) {
        var r = document.getElementById('root');
        if (!r || rootHasApp() || window.__bootBusy) return;
        var old = document.getElementById('boot-error');
        if (old && old.parentNode) old.parentNode.removeChild(old);
        var loading = document.getElementById('boot-loading');
        if (loading) loading.style.display = 'none';

        var card = el('div', 'max-width:560px;margin:40px auto;padding:24px;background:#fff;border:1px solid #e7d9c9;border-radius:20px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#3b3346;box-shadow:0 8px 30px rgba(60,40,80,.08)');
        card.id = 'boot-error';
        card.appendChild(el('h1', 'font-size:20px;margin:0 0 8px;font-weight:700', 'Baby Planner belum bisa ditampilkan'));
        card.appendChild(el('p', 'margin:0 0 14px;font-size:14px;line-height:1.5;color:#6b6075', reason));
        var lines = [];
        if (errors.length) lines.push('Pesan error:\n  - ' + errors.slice(-3).join('\n  - '));
        if (failed.length) lines.push('Pustaka gagal dimuat:\n  - ' + failed.join('\n  - '));
        lines.push('Status:\n  Tailwind CSS: ' + has(window.tailwind && window.tailwind.config !== undefined ? 1 : 0) +
          '\n  Lucide (ikon): ' + has(window.lucide && window.lucide.createIcons && !window.lucide.__stub ? 1 : 0) +
          '\n  google.script.run: ' + has(window.google && window.google.script && window.google.script.run ? 1 : 0) +
          '\n  Skrip utama berjalan: ' + (window.__appBooted ? 'ya' : 'TIDAK'));
        /* bandingkan skrip utama yang DITERIMA browser dengan ukuran yang seharusnya (deteksi file terpotong) */
        var mainEl = null, all = document.scripts;
        for (var k = 0; k < all.length; k++) {
          if (!all[k].src && (!mainEl || all[k].text.length > mainEl.text.length)) mainEl = all[k];
        }
        var recv = mainEl ? mainEl.text.length : 0, exp = 246755;
        lines.push('Ukuran skrip utama:\n  diterima  : ' + recv + ' karakter\n  seharusnya: ' + exp + ' karakter' +
          (recv < exp - 5 ? '\n  >>> TERPOTONG (' + Math.round(recv * 100 / exp) + '% diterima). File index.html tidak tertempel utuh.'
            : (recv > exp + 5 ? '\n  >>> LEBIH BESAR dari seharusnya (file tertimpa/berbeda versi?)' : '\n  ukuran sesuai')));
        var tail = '';
        try { tail = (document.documentElement.outerHTML || '').slice(-70).replace(/\s+/g, ' '); } catch (x) {}
        lines.push('Akhir dokumen yang diterima browser:\n  ...' + tail);
        card.appendChild(el('pre', 'white-space:pre-wrap;word-break:break-word;margin:0 0 16px;padding:12px;background:#faf6f1;border-radius:12px;font-size:12px;line-height:1.5;color:#4a4055', lines.join('\n\n')));
        var btn = el('button', 'padding:10px 18px;border:0;border-radius:12px;background:#8e72c4;color:#fff;font-weight:600;font-size:14px;cursor:pointer', 'Muat ulang halaman');
        btn.onclick = function () { location.reload(); };
        card.appendChild(btn);
        card.appendChild(el('p', 'margin:14px 0 0;font-size:12px;color:#8a7f95', 'Jika masalah berlanjut, kirim tangkapan layar panel ini kepada pengembang.'));
        r.appendChild(card);
      }
      function check(reason, delay) {
        clearTimeout(timer);
        timer = setTimeout(function () { showPanel(reason); }, delay);
      }

      /* fase capture: juga menangkap <script src> yang gagal dimuat (tidak ada bubbling untuk resource error) */
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && t.tagName && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          failed.push(t.src || t.href);
          return;
        }
        errors.push((e.message || 'Error') + (e.filename ? '  [' + String(e.filename).split('/').pop().slice(0, 40) + ':' + e.lineno + ']' : ''));
        check('Terjadi kesalahan saat memulai aplikasi.', 800);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        errors.push('Promise: ' + ((e.reason && e.reason.message) || e.reason));
        check('Terjadi kesalahan saat memulai aplikasi.', 800);
      });
      /* skrip utama tidak pernah sampai ke tahap boot (mis. terpotong saat ditempel) */
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__appBooted) showPanel('Skrip utama aplikasi tidak berjalan. File index.html kemungkinan belum tertempel utuh.');
        }, 4000);
      });
    })();

  <style>
    /* =========================================================================
       DESIGN SYSTEM TOKENS: CALM PASTEL LIGHT MODE & SOFT NIGHT NURSING DARK MODE
       ========================================================================= */
    :root {
      /* Canvas & Surfaces (Warm Cream & Pure Soft White) */
      --bg-canvas: #fdfbf7;
      --bg-surface: #ffffff;
      --bg-subtle: #f7f3fa;
      --bg-elevated: #fcf9fe;

      /* Soothing Pastel Tints */

      --pastel-pink: #fdf0f4;

      --pastel-peach-border: #f8dccb;

      --pastel-blue-border: #d4e8f7;
      --pastel-sage: #eff8f4;
      --pastel-sage-border: #d2ebe0;

      /* Typography Colors (Warm Plum-Ink, zero harsh pure black) */
      --text-ink: #2d283e;
      --text-soft: #59526e;
      --text-muted: #827a96;
      --border-hairline: #ebe3f2;

      /* Primary Brand Accent (Soothing Soft Lavender) */
      --brand-primary: #8265b8;
      --brand-hover: #6f52a6;
      --brand-soft: #efe8fa;
      --brand-text: #624696;

      /* Secondary Warm & Gentle Accents (Replacing harsh reds) */

      --peach-soft: #ffefe8;
      --peach-text: #b85d43;

      --rose-accent: #d4748d;
      --rose-soft: #fcecf1;
      --rose-text: #a84862;

      --sage-text: #2e735a;
      --sky-text: #2d6a96;

      /* Medical Emergency Alert ONLY (High-visibility clinical caution) */
      --emergency-bg: #fff1f2;
      --emergency-border: #fda4af;
      --emergency-text: #be123c;

      /* Hero & Banner Gradients */
      --hero-gradient: linear-gradient(135deg, #f3ecfb 0%, #fdeff4 52%, #fff3ea 100%);
      --banner-bg: #f3ecfb;
      --banner-text: #3d3454;
      --card-shadow: 0 8px 28px -8px rgba(130, 101, 184, 0.09);
    }

    html.dark {
      /* Dark Mode: Soft Midnight Lavender (Low-glare for 2 AM breastfeeding/monitoring) */
      --bg-canvas: #16141f;
      --bg-surface: #201d2c;
      --bg-subtle: #282436;
      --bg-elevated: #2d283d;

      /* Muted Nocturnal Pastel Tints */
      --pastel-lavender: #29233b;
      --pastel-lavender-border: #3c3354;
      --pastel-pink: #33222d;
      --pastel-pink-border: #4d3142;
      --pastel-peach: #342624;
      --pastel-peach-border: #4f3834;
      --pastel-blue: #1f2a38;
      --pastel-blue-border: #304157;
      --pastel-sage: #1e2e2a;
      --pastel-sage-border: #2e4741;

      /* Soft Cream-Lilac Typography (Prevents halation/eye strain in the dark) */
      --text-ink: #f2edf7;
      --text-soft: #cbc2d9;
      --text-muted: #988fa8;
      --border-hairline: #332e45;

      /* Luminous Soft Lavender Primary */
      --brand-primary: #b499f5;
      --brand-hover: #c5afff;

      --brand-text: #d5c4ff;

      --rose-soft: #3b242e;

    body {

      color: var(--text-ink);

      border: 1px solid var(--border-hairline);

    .input-calm {

    html.dark .slide-soft-peach {
      background: linear-gradient(135deg, rgba(52, 38, 36, 0.54) 0%, rgba(229, 142, 115, 0.26) 55%, rgba(22, 20, 31, 0.58) 100%);

    /* Soft Pastel Foreground Veil for Full-Panel Auth Background Showcase */
    .auth-panel-pastel-veil {
      background: linear-gradient(165deg, rgba(253, 251, 247, 0.78) 0%, rgba(242, 236, 251, 0.68) 48%, rgba(253, 240, 244, 0.80) 100%);

    html.dark .auth-panel-pastel-veil {

    /* Soft Warm Pastel Foreground Layer for Warm Welcome Hero Card */
    .welcome-hero-veil {

    /* Custom Scrollbar in Soft Pastel */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-canvas);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-hairline);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);

    /* Smooth scrolling container for Mobile Drawer Nav */
    .mobile-drawer-scroll {
      max-height: calc(100vh - 7.5rem);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Smooth scrolling container for Collapsible Sidebar */
    .sidebar-scroll {
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
  </style>

  <script>
    // =========================================================================
    // 0. THEME MANAGEMENT (LIGHT MODE & LOW-GLARE DARK NURSING MODE)
    // =========================================================================
    const THEME_KEY = 'baby_planner_theme_v5';

    function getSavedTheme() {
      try {
        return localStorage.getItem(THEME_KEY) || 'light';
      } catch (e) {
        return 'light';
      }
    }

    function applyTheme(theme) {
      const htmlEl = document.documentElement;
      if (theme === 'dark') {
        htmlEl.classList.add('dark');
        htmlEl.classList.remove('light');
      } else {
        htmlEl.classList.add('light');
        htmlEl.classList.remove('dark');
      }
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch (e) {}
      updateBannerThemeButton(theme);
    }

    function updateBannerThemeButton(theme) {
      const btn = document.getElementById('banner-theme-btn');
      if (!btn) return;
      if (theme === 'dark') {
        btn.innerHTML = `<i data-lucide="sun" class="w-3.5 h-3.5 text-peach"></i><span>Mode Siang</span>`;
      } else {
        btn.innerHTML = `<i data-lucide="moon" class="w-3.5 h-3.5 text-brand"></i><span>Mode Malam</span>`;
      }
      lucide.createIcons();
    }

    function toggleThemeMode() {
      const isDark = document.documentElement.classList.contains('dark');
      const nextTheme = isDark ? 'light' : 'dark';
      applyTheme(nextTheme);
      showToast(
        nextTheme === 'dark'
          ? 'Mode Malam Menyusui aktif — cahaya lembut untuk kenyamanan mata di tengah malam.'

      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getOffsetDateISO(offsetDays) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + offsetDays);
      return toISODate(d);
    }

    function getFutureDateISO(days) {
      return getOffsetDateISO(days);
    }

    function getPastDateISO(days) {

    function hasGoogleRun() {

    // ---- Token sesi -----------------------------------------------------------
    let _memToken = '';
    function getToken() {
      try { return localStorage.getItem(BP_CONFIG.TOKEN_KEY) || _memToken; } catch (e) { return _memToken; }
    }
    function setToken(token) {
      _memToken = token || '';

    // ---- Error & status koneksi -----------------------------------------------
    class ApiClientError extends Error {
      constructor(code, message) {
        super(message);
        this.name = 'ApiClientError';
        this.code = code;
      }
    }

    function apiErrorMessage(err) {
      if (!err) return 'Terjadi kendala, coba lagi ya.';
      if (err.code === 'NETWORK') return 'Koneksi ke server terputus. Periksa internet Anda lalu coba lagi ya.';
      if (err.code === 'TIMEOUT') return 'Server terlalu lama merespons. Silakan coba lagi sebentar lagi ya.';
      return err.message || 'Terjadi kendala, coba lagi ya.';
    }

    function setConnState(state) {
      const map = {
        online: ['var(--brand-primary)', 'RUANG KELUARGA ONLINE'],
        busy: ['#e0a24a', 'MENYINKRONKAN…'],
        offline: ['#d9697f', 'TIDAK TERSAMBUNG']
      };
      const m = map[state] || map.online;
      const dot = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');
      if (dot) dot.style.backgroundColor = m[0];
      if (label) label.textContent = m[1];
    }

    const READ_ACTIONS = new Set([
      'ping', 'bootstrap', 'auth.me', 'auth.logout', 'family.get', 'members.list', 'member.get',
      'checklist.list', 'schedule.list', 'dosdonts.list', 'doc.list', 'doc.image', 'admin.overview', 'log.list'
    ]);

    let _loadingDepth = 0;

    /** Kirim string JSON ke apiCall() di Code.gs lewat google.script.run; hasilnya string JSON. */
    function callViaAppsScript(body) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new ApiClientError('TIMEOUT', 'Server terlalu lama merespons.')), BP_CONFIG.REQUEST_TIMEOUT_MS);
        google.script.run
          .withSuccessHandler(result => { clearTimeout(timer); resolve(result); })
          .withFailureHandler(err => {
            clearTimeout(timer);
            reject(new ApiClientError('NETWORK', (err && err.message) || 'Gagal terhubung ke server.'));
          })
          .apiCall(body);
      });
    }

    /**
     * Panggil backend. Mengembalikan `data` dari server atau melempar ApiClientError.
     * opts.loading = {title, subtitle}  -> overlay muncul hanya jika respons > LOADING_DELAY_MS
     * opts.noAuth  = true               -> jangan kirim token (login / daftar)
     */
    async function api(action, payload = {}, opts = {}) {
      if (!isApiConfigured()) {
        throw new ApiClientError('NOT_CONFIGURED', 'Alamat server belum diatur. Isi BP_CONFIG.API_URL dengan URL Web App Apps Script.');
      }
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), BP_CONFIG.REQUEST_TIMEOUT_MS);
      let loadingTimer = null;
      let loadingShown = false;
      if (opts.loading) {
        loadingTimer = setTimeout(() => {
          loadingShown = true;
          _loadingDepth++;
          showLoading(opts.loading.title, opts.loading.subtitle);
        }, BP_CONFIG.LOADING_DELAY_MS);
      }
      setConnState('busy');
      try {
        const body = JSON.stringify({ action, token: opts.noAuth ? '' : getToken(), payload });
        let json;
        if (hasGoogleRun()) {
          // MODE B: lewat google.script.run -> fungsi apiCall() di Code.gs
          let raw;
          try {
            raw = await callViaAppsScript(body);
          } catch (e) {
            setConnState('offline');
            throw e instanceof ApiClientError ? e : new ApiClientError('NETWORK', 'Gagal terhubung ke server.');
          }
          try {
            json = JSON.parse(raw);
          } catch (e) {
            setConnState('offline');
            throw new ApiClientError('BAD_RESPONSE', 'Respons server tidak dikenali. Coba muat ulang halaman.');
          }
        } else {
          // MODE A: fetch ke URL Web App (doPost)
          let res;
          try {
            res = await fetch(BP_CONFIG.API_URL, {
              method: 'POST',
              // text/plain = "simple request": tidak memicu preflight CORS yang tidak didukung Apps Script
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body,
              signal: ctrl.signal
            });
          } catch (e) {
            setConnState('offline');
            throw new ApiClientError(e && e.name === 'AbortError' ? 'TIMEOUT' : 'NETWORK', 'Gagal terhubung ke server.');
          }
          try {
            json = await res.json();
          } catch (e) {
            setConnState('offline');
            throw new ApiClientError('BAD_RESPONSE', 'Respons server tidak dikenali. Pastikan URL Web App benar dan akses Deploy diatur ke "Anyone".');
          }
        }
        setConnState('online');
        if (!json || json.ok !== true) {
          const er = (json && json.error) || {};
          if (er.code === 'UNAUTHORIZED') handleSessionExpired();
          throw new ApiClientError(er.code || 'ERROR', er.message || 'Terjadi kendala di server.');
        }
        if (!READ_ACTIONS.has(action) && currentUser && currentUser.role === 'Admin') setTimeout(refreshAdminLogs, 0);
        return json.data;
      } finally {
        clearTimeout(timer);
        clearTimeout(loadingTimer);
        if (loadingShown) {
          _loadingDepth--;
          if (_loadingDepth <= 0) { _loadingDepth = 0; hideLoading(); }
        }
      }
    }

    // ---- Pembantu eksekusi aksi ------------------------------------------------
    const _inflight = new Set();

    /** Cegah klik ganda: satu aksi dengan key yang sama hanya berjalan satu kali sekaligus. */
    async function once(key, fn) {
      if (_inflight.has(key)) return undefined;
      _inflight.add(key);
      try { return await fn(); } finally { _inflight.delete(key); }
    }

    /** once() + tampilkan pesan error ramah bila gagal. */
    function runAction(key, fn) {
      return once(key, async () => {
        try {
          return await fn();
        } catch (err) {
          showToast(apiErrorMessage(err), 'error');
          return undefined;
        }
      });
    }

      if (idx !== -1) members[idx] = me; else members.push(me);
      appState = {

        schedules: data.schedules || [],
        dosDonts: data.dosDonts || [],
        healthDocs: data.healthDocs || [],
        logs: (data.logs || []).map(mapLog),
        stats: data.stats || {},
        adminCounts: null
      };
      currentUser = me;

      const own = appState.families[0];
      const users = (ov.users || []).map(ensureUserProfileDefaults);
      appState.users = users;
      appState.families = (ov.families || []).map(f =>
        own && f.family_id === own.family_id

      );
      appState.logs = (ov.logs || []).map(mapLog);
      appState.adminCounts = ov.counts || null;
      currentUser = users.find(u => u.user_id === currentUser.user_id) || currentUser;
    }

    function upsertUser(serverUser) {
      const existing = appState.users.find(x => x.user_id === serverUser.user_id) || {};
      const merged = ensureUserProfileDefaults({ ...existing, ...serverUser });
      const idx = appState.users.findIndex(x => x.user_id === merged.user_id);
      if (idx !== -1) appState.users[idx] = merged; else appState.users.push(merged);
      if (currentUser && currentUser.user_id === merged.user_id) currentUser = merged;
      return merged;
    }

    let _refreshingLogs = false;

    // ---- Gambar: kompres di browser sebelum diunggah ---------------------------
    async function loadImageSource(file) {
      if (typeof createImageBitmap === 'function') {
        try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* jatuh ke <img> */ }
      }
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
        img.src = url;
      });
    }

    /**
     * Perkecil & ubah ke JPEG. Terus menurunkan kualitas/dimensi sampai panjang data-URL <= maxChars.
     * Avatar dibatasi server 45.000 karakter; foto dokumen 5 MB.
     */
    async function compressImageFile(file, { maxDim, quality, maxChars }) {
      const src = await loadImageSource(file);
      const w0 = src.width;
      const h0 = src.height;
      let dim = maxDim;
      let q = quality;
      try {
        for (let attempt = 0; attempt < 10; attempt++) {
          const scale = Math.min(1, dim / Math.max(w0, h0));
          const w = Math.max(1, Math.round(w0 * scale));
          const h = Math.max(1, Math.round(h0 * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const c2d = canvas.getContext('2d');
          c2d.fillStyle = '#ffffff';
          c2d.fillRect(0, 0, w, h);
          c2d.drawImage(src, 0, 0, w, h);
          const url = canvas.toDataURL('image/jpeg', q);
          if (!maxChars || url.length <= maxChars) return url;
          if (q > 0.5) q = Math.round((q - 0.1) * 100) / 100; else dim = Math.round(dim * 0.8);
        }
      } finally {
        if (src && typeof src.close === 'function') src.close();
      }
      throw new Error('too-large');
    }

    // ---- Foto dokumen kesehatan: dimuat per dokumen & di-cache ------------------
    let docImageCache = {};
    const _docImgInflight = {};

    function resetDocImageCache() {
      docImageCache = {};
    }

    function docImgPlaceholder(doc) {
      return createSampleSVGDataURL(
        String(doc.jenis_catatan || 'DOKUMEN').toUpperCase(),
        doc.has_image === false ? 'Belum ada foto' : 'Memuat foto…'
      );
    }

    function docImgSrc(doc, size) {
      return docImageCache[doc.doc_id + ':' + size] || docImgPlaceholder(doc);
    }

    function fetchDocImage(docId, size) {
      const key = docId + ':' + size;
      if (docImageCache[key]) return Promise.resolve(docImageCache[key]);
      if (_docImgInflight[key]) return _docImgInflight[key];
      _docImgInflight[key] = (async () => {
        try {
          const out = await api('doc.image', { doc_id: docId, size });
          docImageCache[key] = out.data_url;
          return out.data_url;
        } finally {
          delete _docImgInflight[key];
        }
      })();
      return _docImgInflight[key];
    }

    /** Isi <img data-doc-img="DOC-ID" data-doc-size="thumb|full"> yang sudah ada di halaman. */
    function hydrateDocImages() {
      if (!currentUser) return;
      document.querySelectorAll('img[data-doc-img]').forEach(img => {
        const id = img.getAttribute('data-doc-img');
        const size = img.getAttribute('data-doc-size') || 'thumb';
        const doc = appState.healthDocs.find(d => d.doc_id === id);
        if (!doc || !doc.has_image) return;
        const cached = docImageCache[id + ':' + size];
        if (cached) {
          if (img.src !== cached) img.src = cached;
          return;
        }
        fetchDocImage(id, size).then(url => { if (img.isConnected) img.src = url; }).catch(() => {});
      });
    }

    function clearDocImageCacheFor(docId) {
      Object.keys(docImageCache).forEach(k => { if (k.indexOf(docId + ':') === 0) delete docImageCache[k]; });
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDateID(isoDate) {
      if (!isoDate) return '-';
      const parts = String(isoDate).split('-');
      if (parts.length !== 3) return isoDate;
      const monthNames = [
        'Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun',
        'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'
      ];
      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10) - 1;
      const d = parseInt(parts[2], 10);
      if (isNaN(y) || isNaN(m) || isNaN(d) || !monthNames[m]) return isoDate;
      return `${d} ${monthNames[m]} ${y}`;
    }

    function formatRupiah(amount) {

      return 'Rp ' + num.toLocaleString('id-ID');

    function getPregnancyWeekInfoForDate(isoDate, fam) {
      const targetFamily = fam || getCurrentFamily();
      const hplStr = targetFamily && targetFamily.hpl_date ? targetFamily.hpl_date : DEFAULT_HPL;
      const hplDate = new Date(hplStr + 'T00:00:00');
      const targetDate = new Date((isoDate || toISODate(new Date())) + 'T00:00:00');

      const msPerDay = 1000 * 60 * 60 * 24;
      const daysRemaining = Math.round((hplDate - targetDate) / msPerDay);
      const daysPregnant = 280 - daysRemaining;
      const week = Math.max(1, Math.ceil(daysPregnant / 7));
      const clampedWeek = Math.min(42, week);
      const progressPercent = Math.min(100, Math.max(0, Math.round((daysPregnant / 280) * 100)));

      let trimesterLabel = 'Trimester 1';
      let kategoriTrimester = 'Trimester 1 (Minggu 1–13)';
      if (clampedWeek >= 14 && clampedWeek <= 27) {
        trimesterLabel = 'Trimester 2';
        kategoriTrimester = 'Trimester 2 (Minggu 14–27)';
      } else if (clampedWeek >= 28) {
        trimesterLabel = 'Trimester 3';
        kategoriTrimester = 'Trimester 3 (Minggu 28–40)';
      }

      return {
        week: clampedWeek,
        daysRemaining,
        daysPregnant,
        progressPercent,
        trimesterLabel,
        kategoriTrimester
      };
    }

    function sortPregnancyByDateTime(a, b) {
      const da = a.due_date || '9999-12-31';
      const db = b.due_date || '9999-12-31';
      if (da !== db) return da.localeCompare(db);
      const ta = a.due_time || '08:00';
      const tb = b.due_time || '08:00';
      return ta.localeCompare(tb);
    }

    function syncPregnancyModalWeek(isoDate) {
      if (!isoDate) return;
      const fam = getCurrentFamily();
      const info = getPregnancyWeekInfoForDate(isoDate, fam);
      const katEl = document.getElementById('chk-kategori');
      const subEl = document.getElementById('chk-subperiode');
      if (katEl) katEl.value = info.kategoriTrimester;
      if (subEl && info.week > 0) {
        const bulan = Math.min(9, Math.max(1, Math.ceil(info.week / 4.33)));
        subEl.value = `Bulan ${bulan} • Minggu ${info.week}`;
      }
    }

    async function saveChecklistForm(e, modul, editItemId) {
      e.preventDefault();
      const kategori = document.getElementById('chk-kategori').value;
      const sub_periode = document.getElementById('chk-subperiode').value.trim();
      const judul_item = document.getElementById('chk-judul').value.trim();
      const deskripsi = document.getElementById('chk-deskripsi').value.trim();
      const catatan = document.getElementById('chk-catatan').value.trim();
      const dueDateEl = document.getElementById('chk-due-date');
      const dueTimeEl = document.getElementById('chk-due-time');
      const qtyEl = document.getElementById('chk-qty');
      const hargaEl = document.getElementById('chk-harga');

      // Penentuan modul akhir & pekan kehamilan dihitung ulang oleh server
      const payload = { modul, kategori, sub_periode, judul_item, deskripsi, catatan };
      if (dueDateEl && dueDateEl.value) payload.due_date = dueDateEl.value;
      if (dueTimeEl && dueTimeEl.value) payload.due_time = dueTimeEl.value;
      if (qtyEl) payload.qty = Math.max(1, parseInt(qtyEl.value, 10) || 1);
      if (hargaEl) payload.estimasi_harga = Math.max(0, parseInt(hargaEl.value, 10) || 0);

      await runAction('chk-save', async () => {
        let item;
        if (editItemId) {
          payload.item_id = editItemId;
          item = (await api('checklist.update', payload, { loading: LOADING_SAVE })).item;
          const idx = appState.checklists.findIndex(c => c.item_id === editItemId);
          if (idx !== -1) appState.checklists[idx] = item; else appState.checklists.push(item);
          showToast('Catatan berhasil diperbarui dengan rapi.', 'success');
        } else {
          item = (await api('checklist.create', payload, { loading: LOADING_SAVE })).item;
          appState.checklists.push(item);
          showToast('Rencana baru berhasil ditambahkan ke daftar keluarga.', 'success');
        }

        if (item.due_date) {
          uiState.selectedCalendarDate = item.due_date;
          const parsed = new Date(item.due_date + 'T00:00:00');
          uiState.calendarYear = parsed.getFullYear();
          uiState.calendarMonth = parsed.getMonth();
        }
        closeModal();
        renderApp();
      });
    }

    async function saveDocForm(e, editDocId) {
      e.preventDefault();
      const jenis = document.getElementById('doc-jenis').value;
      const tanggal = document.getElementById('doc-tanggal').value;
      const judul = document.getElementById('doc-judul').value.trim();
      const ringkasan = document.getElementById('doc-ringkasan').value.trim();
      const fileInput = document.getElementById('doc-file');
      const file = fileInput.files && fileInput.files[0];

      await runAction('doc-save', async () => {
        showLoading(editDocId ? 'Menyimpan Perubahan...' : 'Menyimpan ke Galeri...', 'Merapikan foto & catatan kesehatan keluarga');
        try {
          const payload = { jenis_catatan: jenis, tanggal, judul, ringkasan_medis: ringkasan };
          if (file) {
            if (!file.type.startsWith('image/')) {
              throw new ApiClientError('BAD_IMAGE', 'Yuk pilih file gambar yang sesuai (JPG, PNG, atau WebP).');
            }
            try {
              // Foto ponsel bisa belasan MB: perkecil dulu agar cepat & muat batas server (5 MB)
              payload.image_data = await compressImageFile(file, { maxDim: 1600, quality: 0.85, maxChars: 6000000 });
            } catch (_) {
              throw new ApiClientError('BAD_IMAGE', 'Maaf, foto belum terbaca dengan baik. Coba pilih file lain ya.');
            }
          }

          let out;
          if (editDocId) {
            payload.doc_id = editDocId;
            out = await api('doc.update', payload);
          } else {
            out = await api('doc.create', payload);
          }
          const item = out.item;
          clearDocImageCacheFor(item.doc_id);
          if (payload.image_data) {
            docImageCache[item.doc_id + ':full'] = payload.image_data;
            docImageCache[item.doc_id + ':thumb'] = payload.image_data;
          }
          const idx = appState.healthDocs.findIndex(d => d.doc_id === item.doc_id);
          if (idx !== -1) appState.healthDocs[idx] = item; else appState.healthDocs.unshift(item);
          sortHealthDocs();

          showToast(
            editDocId ? 'Catatan & foto kesehatan berhasil diperbarui.' : 'Foto & catatan berhasil disimpan ke galeri keluarga!',
            'success'
          );
          closeModal();
          renderApp();
        } finally {
          hideLoading();
        }
      });
    }

    const AVATAR_COLOR_MAP = {
      lavender: { bg: 'bg-[#8e72c4]', text: 'text-white', label: 'Ungu Lembut' },
      peach: { bg: 'bg-[#e39278]', text: 'text-white', label: 'Peach Hangat' },

    function getUserInitials(name) {
      if (!name) return 'BP';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function renderUserAvatar(user, sizeClass = 'w-11 h-11', textClass = 'text-sm') {
      const palette = AVATAR_COLOR_MAP[user.avatar_color] || AVATAR_COLOR_MAP.lavender;
      if (user.avatar_url) {
        return `
          <div class="${sizeClass} rounded-full overflow-hidden border-2 border-pastelLavender-border shrink-0 bg-subtle">
            <img src="${user.avatar_url}" alt="${escapeHTML(user.nama_lengkap)}" class="w-full h-full object-cover" />
          </div>
        `;
      }
      return `
        <div class="${sizeClass} rounded-full ${palette.bg} ${palette.text} font-bold ${textClass} flex items-center justify-center shrink-0 select-none">
          ${escapeHTML(getUserInitials(user.nama_lengkap))}
        </div>
      `;
    }

    function computeUserContributionStats(user) {
      const srv = (appState.stats && appState.stats[user.user_id]) || null;
      const sameFamily = !!currentUser && user.family_id === currentUser.family_id;
      const totalUsersCount = srv && typeof srv.totalUsersCount === 'number' ? srv.totalUsersCount : appState.users.length;
      const totalFamiliesCount = srv && typeof srv.totalFamiliesCount === 'number' ? srv.totalFamiliesCount : appState.families.length;

      // Anggota keluarga lain (hanya Admin yang bisa): data lokal tidak lengkap, pakai angka server
      if (srv && !sameFamily) {
        return {
          completedByUser: srv.completedByUser,
          uploadedDocsCount: srv.uploadedDocsCount,
          familySchedulesCount: srv.familySchedulesCount,
          userLogsCount: srv.userLogsCount,
          adminGuidesCount: srv.adminGuidesCount,
          totalUsersCount,
          totalFamiliesCount
        };
      }

      const famChecks = appState.checklists.filter(c => c.family_id === user.family_id);
      const roleTag = (user.family_role || '').toLowerCase();
      const nameTag = (user.nama_lengkap || '').toLowerCase();

      const completedByUser = famChecks.filter(c => {
        if (!c.is_completed) return false;
        const updater = (c.updated_by || '').toLowerCase();
        return updater === roleTag || updater === nameTag || (roleTag && updater.includes(roleTag));
      }).length;

      const uploadedDocsCount = appState.healthDocs.filter(d =>
        d.family_id === user.family_id &&
        (d.uploaded_by_id ? d.uploaded_by_id === user.user_id : (d.uploaded_by || '').toLowerCase() === nameTag)
      ).length;

      const familySchedulesCount = appState.schedules.filter(s => s.family_id === user.family_id).length;

      return {
        completedByUser,
        uploadedDocsCount,
        familySchedulesCount,
        userLogsCount: srv ? srv.userLogsCount : 0,
        adminGuidesCount: appState.dosDonts.length,
        totalUsersCount,
        totalFamiliesCount
      };
    }

    async function handleAvatarUpload(event) {
      const input = event.target;
      const file = input.files && input.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('Yuk pilih file gambar yang sesuai (JPG, PNG, atau WebP).', 'error');
        input.value = '';
        return;
      }

      await runAction('avatar', async () => {
        showLoading('Memperbarui Foto...', 'Menyesuaikan bingkai profil Bunda/Ayah');
        try {
          let dataUrl;
          try {
            // Server membatasi avatar 45.000 karakter; kompresi menurunkan kualitas otomatis bila perlu
            dataUrl = await compressImageFile(file, { maxDim: 320, quality: 0.85, maxChars: 42000 });
          } catch (_) {
            showToast('Maaf, foto belum terbaca dengan baik. Coba pilih file lain ya.', 'error');
            return;
          }
          const out = await api('profile.avatar.upload', { data_url: dataUrl });
          upsertUser(out.user);
          showToast('Foto profil berhasil diperbarui!', 'success');
          renderApp();
        } finally {
          hideLoading();
          input.value = '';
        }
      });
    }

    function copyTextToClipboard(text, successMsg = 'Teks berhasil disalin!') {
      try {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.setAttribute('readonly', '');
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.select();
        const copied = document.execCommand('copy');
        document.body.removeChild(tempInput);
        if (copied) {
          showToast(successMsg, 'success');
          return;
        }
      } catch (err) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(successMsg, 'success'))
          .catch(() => showToast('Gagal menyalin otomatis. Silakan salin manual ya.', 'error'));
      } else {
        showToast('Silakan salin tautan secara manual ya.', 'info');
      }
    }

    // --- TAB 2: KALENDAR TO-DO LIST & TIMELINE KEHAMILAN ---
    function renderPregnancyTab() {
      const fam = getCurrentFamily();
      const allPregItems = appState.checklists

        .sort(sortPregnancyByDateTime);

      return `

                  <span>Tampilan Kalendar</span>
                </button>
                <button onclick="uiState.pregnancyViewMode='list'; renderApp()" class="px-4 py-2 rounded-full text-xs font-bold flex items-center gap-1.5 transition ${!isCalendar ? 'bg-brand text-white' : 'text-inkSoft hover:text-ink'}">
                  <i data-lucide="list-checks" class="w-4 h-4"></i>
                  <span>Semua Rencana (${allPregItems.length})</span>
                </button>
              </div>
              <button onclick="openAddChecklistModal('pregnancy_todo', '', '${uiState.selectedCalendarDate}')" class="px-5 py-3 bg-brand hover:bg-brand-hover text-white text-xs sm:text-sm font-bold rounded-full btn-press inline-flex items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Tambah Agenda</span>

            </div>
          </div>

          ${isCalendar ? renderPregnancyCalendarView(allPregItems, fam) : renderPregnancyListView(allPregItems)}
        </div>
      `;

    function renderPregnancyCalendarView(allPregItems, fam) {
      const monthNames = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const dayHeaders = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];

      const year = uiState.calendarYear;
      const month = uiState.calendarMonth;
      const todayISO = toISODate(new Date());
      const selectedISO = uiState.selectedCalendarDate || todayISO;

      const firstDayOfMonth = new Date(year, month, 1);
      const startWeekday = (firstDayOfMonth.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
      const cells = [];

      for (let i = 0; i < totalCells; i++) {
        const dayOffset = i - startWeekday;
        const cellDate = new Date(year, month, 1 + dayOffset);
        const iso = toISODate(cellDate);
        const inCurrentMonth = cellDate.getMonth() === month;
        const dayTasks = allPregItems
          .filter(item => item.due_date === iso)
          .sort(sortPregnancyByDateTime);
        const weekInfo = getPregnancyWeekInfoForDate(iso, fam);
        const isHpl = fam.hpl_date === iso;

        cells.push({
          iso,
          dayNum: cellDate.getDate(),
          inCurrentMonth,
          dayTasks,
          weekInfo,
          isToday: iso === todayISO,
          isSelected: iso === selectedISO,
          isHpl,
          isMonday: i % 7 === 0
        });
      }

      const selectedTasks = allPregItems
        .filter(item => item.due_date === selectedISO)
        .sort(sortPregnancyByDateTime);
      const selectedWeekInfo = getPregnancyWeekInfoForDate(selectedISO, fam);
      const weekCompanionTasks = allPregItems
        .filter(item => item.due_date !== selectedISO && item.week_number === selectedWeekInfo.week && selectedWeekInfo.week > 0)
        .sort(sortPregnancyByDateTime);

      return `
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
          
          <!-- Monthly Calendar Grid (8 cols) -->
          <div class="xl:col-span-8 card-surface overflow-hidden">
            <div class="p-5 sm:p-6 border-b border-hairline flex flex-wrap items-center justify-between gap-3 bg-surface">
              <div class="flex items-center gap-2.5">
                <button onclick="changeCalendarMonth(-1)" title="Bulan Sebelumnya" class="p-2.5 rounded-full border border-hairline hover:bg-subtle text-ink">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <h2 class="text-lg font-extrabold text-ink min-w-[175px] text-center display-friendly">
                  ${monthNames[month]} ${year}
                </h2>
                <button onclick="changeCalendarMonth(1)" title="Bulan Berikutnya" class="p-2.5 rounded-full border border-hairline hover:bg-subtle text-ink">
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
              </div>

              <div class="flex flex-wrap items-center gap-2.5">
                <button onclick="jumpCalendarToToday()" class="px-4 py-2 rounded-full text-xs font-bold bg-subtle hover:bg-pastelLavender text-ink border border-hairline">
                  Hari Ini
                </button>
                <div class="hidden sm:flex items-center gap-3 text-xs text-inkSoft pl-2">
                  <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-brand"></span> Rencana</span>
                  <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-sageText"></span> Selesai</span>
                  <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-peach"></span> HPL</span>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-7 border-b border-hairline bg-subtle/70">
              ${dayHeaders.map(d => `
                <div class="py-3 text-center font-mono text-xs font-bold uppercase text-inkMuted">
                  ${d}
                </div>
              `).join('')}
            </div>

            <div class="grid grid-cols-7 divide-x divide-y divide-hairline">
              ${cells.map(cell => {
                const bgClass = cell.isSelected
                  ? 'bg-pastelLavender/70 ring-2 ring-inset ring-brand'
                  : cell.inCurrentMonth
                    ? 'bg-surface hover:bg-subtle/60'
                    : 'bg-subtle/35 text-inkMuted/60 hover:bg-subtle/60';

                return `
                  <div onclick="selectCalendarDate('${cell.iso}')" class="min-h-[92px] sm:min-h-[110px] p-2 cursor-pointer transition flex flex-col justify-between relative group ${bgClass}">
                    <div class="flex items-center justify-between gap-1">
                      <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${cell.isToday ? 'bg-peach text-white' : cell.isSelected ? 'bg-brand text-white' : ''}">
                        ${cell.dayNum}
                      </span>
                      ${cell.isHpl ? `
                        <span class="font-mono text-[10px] font-bold px-2 py-0.5 rounded-full bg-peach text-white">HPL</span>
                      ` : (cell.isMonday && cell.weekInfo.week > 0 && cell.weekInfo.week <= 40) ? `
                        <span class="font-mono text-[10px] font-semibold px-2 py-0.5 rounded-full bg-subtle text-inkSoft border border-hairline">Mg ${cell.weekInfo.week}</span>
                      ` : ''}
                    </div>

                    <div class="mt-1.5 space-y-1 overflow-hidden">
                      ${cell.dayTasks.slice(0, 2).map(t => `
                        <div class="text-[11px] leading-tight px-2 py-1 rounded-xl truncate font-semibold ${t.is_completed ? 'bg-pastelSage text-sageText line-through' : 'bg-pastelLavender text-brand-text border border-pastelLavender-border'}">
                          ${t.due_time ? `<span class="font-mono font-bold">${escapeHTML(t.due_time)}</span> ` : ''}${escapeHTML(t.judul_item)}
                        </div>
                      `).join('')}
                      ${cell.dayTasks.length > 2 ? `
                        <div class="text-[10px] font-mono font-semibold text-inkMuted pl-1">+${cell.dayTasks.length - 2} lainnya</div>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Selected Date Panel (4 cols) -->
          <div class="xl:col-span-4 space-y-5">
            <div class="card-surface p-6 space-y-5">
              <div class="flex items-start justify-between gap-3 border-b border-hairline pb-4">
                <div>
                  <span class="font-mono text-[11px] font-bold text-brand-text bg-pastelLavender px-3 py-1 rounded-full">
                    ${selectedWeekInfo.week > 0 && selectedWeekInfo.week <= 42
                      ? `${selectedWeekInfo.trimesterLabel} • Minggu ke-${selectedWeekInfo.week}`
                      : 'Kalendar Kehamilan'}
                  </span>
                  <h3 class="text-xl font-extrabold text-ink mt-2 display-friendly">${formatDateID(selectedISO)}</h3>
                  ${fam.hpl_date === selectedISO ? `<p class="text-xs font-bold text-peach-text mt-1">Hari Perkiraan Bertemu Si Kecil!</p>` : ''}
                </div>
                <button onclick="openAddChecklistModal('pregnancy_todo', '', '${selectedISO}')" class="px-4 py-2.5 rounded-full bg-brand hover:bg-brand-hover text-white text-xs font-bold btn-press inline-flex items-center gap-1.5 shrink-0">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>Tambah</span>
                </button>
              </div>

              <div class="space-y-3">
                <p class="text-xs font-bold text-inkSoft uppercase tracking-wider">Agenda Hari Ini (${selectedTasks.length})</p>
                ${selectedTasks.length === 0 ? `
                  <div class="p-6 rounded-3xl bg-subtle/70 border border-dashed border-hairline text-center space-y-2.5">
                    ${renderEmptyStateIllustration()}
                    <p class="text-xs sm:text-sm text-inkSoft">Hari ini kosong dan tenang pada ${formatDateID(selectedISO)}.</p>
                    <button onclick="openAddChecklistModal('pregnancy_todo', '', '${selectedISO}')" class="text-xs font-bold text-brand-text hover:underline">
                      + Catat Rencana Lembut di Tanggal Ini
                    </button>
                  </div>
                ` : selectedTasks.map(item => `
                  <div class="p-4 rounded-2xl border border-hairline ${item.is_completed ? 'bg-subtle/60' : 'bg-surface'} flex items-start gap-3.5">
                    <button onclick="toggleChecklistItem('${item.item_id}')" class="mt-0.5 w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 transition ${item.is_completed ? 'bg-brand border-brand text-white' : 'border-inkMuted hover:border-brand'}">
                      ${item.is_completed ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                    </button>
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-1.5 mb-1.5">
                        <span class="font-mono text-xs font-bold px-2.5 py-0.5 rounded-full bg-pastelPeach text-peach-text inline-flex items-center gap-1">
                          <i data-lucide="clock" class="w-3 h-3"></i>
                          ${escapeHTML(item.due_time || '08:00')}
                        </span>
                      </div>
                      <p class="text-sm font-bold ${item.is_completed ? 'line-through text-inkMuted' : 'text-ink'}">${escapeHTML(item.judul_item)}</p>
                      ${item.deskripsi ? `<p class="text-xs text-inkSoft mt-1 leading-relaxed">${escapeHTML(item.deskripsi)}</p>` : ''}
                      ${item.catatan ? `<p class="text-xs text-brand-text font-medium mt-1">Catatan: ${escapeHTML(item.catatan)}</p>` : ''}
                      <span class="inline-block text-[11px] text-inkMuted mt-1.5">Dicatat oleh ${escapeHTML(item.updated_by || 'Bunda')}</span>
                    </div>
                    <div class="flex flex-col items-end gap-1 shrink-0">
                      <button onclick="openEditChecklistModal('${item.item_id}')" title="Sesuaikan" class="p-2 text-inkSoft hover:text-ink rounded-xl hover:bg-subtle">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                      </button>
                      <button onclick="deleteChecklistItem('${item.item_id}')" title="Hapus" class="p-2 text-inkMuted hover:text-roseCalm-text rounded-xl hover:bg-roseCalm-soft">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>

              ${weekCompanionTasks.length > 0 ? `
                <div class="pt-4 border-t border-hairline space-y-2.5">
                  <p class="text-xs font-bold text-inkMuted uppercase tracking-wider">Agenda Lain di Minggu ke-${selectedWeekInfo.week}</p>
                  ${weekCompanionTasks.map(item => `
                    <div onclick="selectCalendarDate('${item.due_date}')" class="p-3 rounded-2xl bg-subtle hover:bg-pastelLavender/60 cursor-pointer flex items-center justify-between gap-2 text-xs">
                      <span class="truncate font-semibold ${item.is_completed ? 'line-through text-inkMuted' : 'text-ink'}">
                        ${item.due_time ? `<strong class="font-mono text-brand-text mr-1.5">${escapeHTML(item.due_time)}</strong>` : ''}${escapeHTML(item.judul_item)}
                      </span>
                      <span class="font-mono text-[11px] text-inkSoft shrink-0">${formatDateID(item.due_date)}</span>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </div>

        </div>
      `;
    }

    function renderPregnancyListView(allPregItems) {
      let items = [...allPregItems].sort(sortPregnancyByDateTime);
      if (uiState.pregnancyTrimesterFilter !== 'ALL') {
        items = items.filter(c => c.kategori === uiState.pregnancyTrimesterFilter);
      }
      if (uiState.pregnancyStatusFilter === 'DONE') items = items.filter(c => c.is_completed);
      if (uiState.pregnancyStatusFilter === 'PENDING') items = items.filter(c => !c.is_completed);

      return `
        <div class="space-y-5">
          <div class="card-surface p-5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap gap-2">
              ${['ALL', 'Trimester 1 (Minggu 1–13)', 'Trimester 2 (Minggu 14–27)', 'Trimester 3 (Minggu 28–40)'].map(tri => {
                const label = tri === 'ALL' ? 'Semua Trimester' : tri.split(' (')[0];
                const active = uiState.pregnancyTrimesterFilter === tri;
                return `<button onclick="uiState.pregnancyTrimesterFilter='${tri}'; renderApp()" class="px-4 py-2 rounded-full text-xs font-bold transition ${active ? 'bg-brand text-white' : 'bg-subtle text-inkSoft hover:text-ink'}">${label}</button>`;
              }).join('')}
            </div>
            <select onchange="uiState.pregnancyStatusFilter=this.value; renderApp()" class="px-4 py-2 text-xs font-bold rounded-full input-calm">
              <option value="ALL" ${uiState.pregnancyStatusFilter === 'ALL' ? 'selected' : ''}>Tampilkan: Semua</option>
              <option value="PENDING" ${uiState.pregnancyStatusFilter === 'PENDING' ? 'selected' : ''}>Masih Dalam Rencana</option>
              <option value="DONE" ${uiState.pregnancyStatusFilter === 'DONE' ? 'selected' : ''}>Sudah Dilakukan</option>
            </select>
          </div>

          <div class="space-y-4">
            ${items.length === 0 ? `
              <div class="card-surface p-10 text-center space-y-2">
                ${renderEmptyStateIllustration()}
                <p class="text-sm font-semibold text-inkSoft">Belum ada rencana pada pilihan tampilan ini.</p>
              </div>
            ` : items.map(item => `

    function renderHealthDocsTab() {
      const allFamilyDocs = appState.healthDocs.filter(d => d.family_id === currentUser.family_id);

      const extraCategories = allFamilyDocs
        .map(d => d.jenis_catatan)
        .filter(cat => cat && !baseCategories.includes(cat));
      const categories = ['ALL', ...baseCategories, ...new Set(extraCategories)];

      const activeFilter = categories.includes(uiState.healthDocCategoryFilter)
        ? uiState.healthDocCategoryFilter
        : 'ALL';

      const docs = activeFilter === 'ALL'
        ? allFamilyDocs
        : allFamilyDocs.filter(d => d.jenis_catatan === activeFilter);

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

            <button onclick="openUploadDocModal('${activeFilter === 'ALL' ? '' : escapeHTML(activeFilter)}')" class="px-5 py-3 bg-brand hover:bg-brand-hover text-white text-xs sm:text-sm font-bold rounded-full btn-press inline-flex items-center gap-2 self-start">

          <div class="flex flex-wrap items-center gap-2">

              const active = activeFilter === cat;
              const count = cat === 'ALL'

          ${docs.length === 0 ? `

                      <button onclick="previewDocModal('${doc.doc_id}')" class="text-xs font-bold text-brand-text hover:underline">

                  <input type="text" id="prof-nohp" value="${escapeHTML(currentUser.no_hp || '')}" placeholder="Contoh: 0812-3456-7890" class="w-full px-4 py-3 text-sm font-mono input-calm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-inkSoft mb-1.5">Tanggal Lahir</label>
                  <input type="date" id="prof-tgllahir" value="${escapeHTML(currentUser.tanggal_lahir || '')}" class="w-full px-4 py-3 text-sm input-calm" />
                </div>
              </div>

              <div class="p-5 rounded-3xl bg-pastelPink/40 border border-pastelPink-border space-y-4">
                <div class="flex items-center gap-2 text-xs font-bold text-roseCalm-text">
                  <i data-lucide="heart-pulse" class="w-4 h-4"></i>
                  <span>Catatan Kesehatan &amp; Rumah Sakit Rujukan</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-inkSoft mb-1.5">Golongan Darah</label>
                    <select id="prof-goldarah" class="w-full px-4 py-3 text-sm font-mono input-calm">
                      ${bloodGroups.map(bg => `<option value="${bg}" ${currentUser.golongan_darah === bg ? 'selected' : ''}>${bg}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-inkSoft mb-1.5">Riwayat Alergi Obat / Makanan</label>
                    <input type="text" id="prof-alergi" value="${escapeHTML(currentUser.alergi || '')}" placeholder="Contoh: Tidak ada" class="w-full px-4 py-3 text-sm input-calm" />
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-inkSoft mb-1.5">Rumah Sakit / Klinik Utama</label>
                    <input type="text" id="prof-faskes" value="${escapeHTML(currentUser.faskes_utama || '')}" placeholder="Contoh: RSIA Bunda Menteng" class="w-full px-4 py-3 text-sm input-calm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-inkSoft mb-1.5">Dokter / Bidan Pendamping</label>
                    <input type="text" id="prof-dokter" value="${escapeHTML(currentUser.dokter_pj || '')}" placeholder="Contoh: dr. Rahma Wijaya, Sp.OG" class="w-full px-4 py-3 text-sm input-calm" />
                  </div>
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-inkSoft mb-1.5">Catatan Hangat / Peran di Keluarga</label>
                <textarea id="prof-bio" rows="2" placeholder="Tuliskan pesan singkat atau fokus dukungan Anda..." class="w-full px-4 py-3 text-sm input-calm">${escapeHTML(currentUser.bio_catatan || '')}</textarea>
              </div>

              <div class="flex justify-end pt-1">
                <button type="submit" class="px-6 py-3 bg-brand hover:bg-brand-hover text-white text-xs sm:text-sm font-bold rounded-full btn-press inline-flex items-center gap-2">
                  <i data-lucide="save" class="w-4 h-4"></i>
                  <span>Simpan Perubahan Profil</span>
                </button>
              </div>
            </form>

          </div>
        </div>
      `;
    }

    function renderFamilyDirectoryView(fam, familyMembers) {
      return `
        <div class="space-y-6">
          <div class="card-surface p-6 sm:p-7 bg-pastelLavender/50 border-pastelLavender-border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1">
              <span class="font-mono text-xs font-bold text-brand-text bg-surface px-3 py-1 rounded-full border border-hairline">
                RUANG BERSAMA: ${escapeHTML(fam.invite_code)}
              </span>
              <h2 class="text-xl font-extrabold text-ink pt-1 display-friendly">${escapeHTML(fam.nama_keluarga)}</h2>
              <p class="text-xs sm:text-sm text-inkSoft">Informasi kontak darurat, golongan darah, dan faskes pendamping masing-masing anggota keluarga.</p>
            </div>

            <button onclick="navigator.clipboard?.writeText('${escapeHTML(fam.invite_code)}'); showToast('Kode Keluarga ${escapeHTML(fam.invite_code)} disalin! Bagikan ke pasangan ya.', 'success')" class="px-5 py-3 rounded-full bg-brand hover:bg-brand-hover text-white text-xs font-bold btn-press inline-flex items-center gap-2 self-start sm:self-center">
              <i data-lucide="copy" class="w-4 h-4"></i>
              <span>Salin Kode Undangan</span>
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${familyMembers.map(member => {
              const isSelf = member.user_id === currentUser.user_id;
              const stats = computeUserContributionStats(member);

              return `
                <div class="card-surface p-6 sm:p-7 flex flex-col justify-between space-y-5 ${isSelf ? 'ring-2 ring-brand/40' : ''}">
                  <div class="space-y-4">
                    <div class="flex items-start justify-between gap-3">
                      <div class="flex items-center gap-4">
                        ${renderUserAvatar(member, 'w-16 h-16', 'text-xl')}
                        <div>
                          <div class="flex flex-wrap items-center gap-2">
                            <h3 class="text-lg font-extrabold text-ink display-friendly">${escapeHTML(member.nama_lengkap)}</h3>
                            <span class="font-mono text-xs font-bold px-3 py-0.5 rounded-full ${member.family_role === 'Bunda' ? 'bg-pastelLavender text-brand-text' : 'bg-pastelPeach text-peach-text'}">
                              ${escapeHTML(member.family_role)}
                            </span>
                            ${isSelf ? `<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-brand text-white">Anda</span>` : ''}
                          </div>
                          <p class="text-xs text-inkMuted mt-0.5">${escapeHTML(member.email)}</p>
                        </div>
                      </div>
                    </div>

                    ${member.bio_catatan ? `
                      <p class="text-xs sm:text-sm text-inkSoft leading-relaxed bg-subtle p-4 rounded-2xl">
                        ${escapeHTML(member.bio_catatan)}
                      </p>
                    ` : ''}

                    <div class="grid grid-cols-2 gap-3 text-xs">
                      <div class="p-3.5 rounded-2xl border border-pastelPink-border bg-pastelPink/40">
                        <span class="text-inkMuted block">Golongan Darah</span>
                        <span class="font-mono text-base font-extrabold text-roseCalm-text mt-0.5 block">${escapeHTML(member.golongan_darah || 'Belum diketahui')}</span>
                      </div>
                      <div class="p-3.5 rounded-2xl border border-pastelBlue-border bg-pastelBlue/40 flex items-center justify-between gap-2">
                        <div class="min-w-0">
                          <span class="text-inkMuted block">No. HP / WhatsApp</span>
                          <span class="font-mono font-bold text-ink mt-0.5 block truncate">${escapeHTML(member.no_hp || '-')}</span>
                        </div>
                        ${member.no_hp ? `
                          <button type="button" onclick="navigator.clipboard?.writeText('${escapeHTML(member.no_hp)}'); showToast('Nomor ${escapeHTML(member.nama_lengkap)} disalin!', 'success')" title="Salin Nomor HP" class="p-2 rounded-xl hover:bg-surface text-inkSoft shrink-0">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                          </button>
                        ` : ''}
                      </div>
                      <div class="p-3.5 rounded-2xl border border-hairline bg-subtle col-span-2">
                        <span class="text-inkMuted block">Faskes Utama &amp; Dokter Pendamping</span>
                        <span class="font-bold text-ink mt-0.5 block">${escapeHTML(member.faskes_utama || 'Belum diisi')}</span>
                        ${member.dokter_pj ? `<span class="text-xs text-brand-text font-semibold block mt-0.5">${escapeHTML(member.dokter_pj)}</span>` : ''}
                      </div>
                    </div>
                  </div>

                  <div class="pt-4 border-t border-hairline flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-4 text-xs text-inkSoft">
                      <span><strong class="font-mono text-ink">${member.role === 'Admin' ? stats.adminGuidesCount : stats.completedByUser}</strong> ${member.role === 'Admin' ? 'panduan' : 'langkah siap'}</span>
                      <span><strong class="font-mono text-ink">${member.role === 'Admin' ? stats.totalUsersCount : stats.uploadedDocsCount}</strong> ${member.role === 'Admin' ? 'akun' : 'arsip foto'}</span>
                    </div>

                    <div class="flex items-center gap-2">
                      <button type="button" onclick="openMemberProfileModal('${member.user_id}')" class="px-4 py-2 rounded-full border border-hairline hover:bg-subtle text-xs font-bold text-ink transition">
                        Kartu Detail
                      </button>
                      ${isSelf ? `
                        <button type="button" onclick="uiState.profileSubTab='my_profile'; renderApp()" class="px-4 py-2 rounded-full bg-brand hover:bg-brand-hover text-white text-xs font-bold transition">
                          Sesuaikan
                        </button>
                      ` : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // --- TAB 8: KURATOR ADMIN ---
    function renderAdminTab() {
      if (currentUser.role !== 'Admin') {
        return `<div class="card-surface p-8 text-center text-sm text-roseCalm-text">Halaman kurator ini khusus untuk peran Admin Pendamping.</div>`;
      }

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span class="font-mono text-xs font-bold text-brand-text bg-pastelLavender px-3 py-1 rounded-full">RUANG KURATOR PANDUAN</span>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-ink display-friendly mt-2">Kurasi Edukasi Keluarga &amp; Ringkasan Sistem</h1>
              <p class="text-sm text-inkSoft mt-1">Susun panduan perawatan bayi yang hangat, empatik, dan dilengkapi sumber referensi tepercaya.</p>
            </div>
            <button onclick="openDosDontsFormModal()" class="px-5 py-3 bg-brand hover:bg-brand-hover text-white text-xs sm:text-sm font-bold rounded-full btn-press inline-flex items-center gap-2 self-start">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Tambah Panduan Baru</span>
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div class="card-surface p-5">
              <p class="text-xs font-bold text-inkMuted">Topik Panduan Newborn</p>
              <p class="text-2xl font-extrabold font-mono text-brand-text mt-1">${appState.dosDonts.length} Topik</p>
            </div>
            <div class="card-surface p-5">
              <p class="text-xs font-bold text-inkMuted">Pengguna Terdaftar</p>
              <p class="text-2xl font-extrabold font-mono text-ink mt-1">${appState.users.length} Akun</p>
            </div>
            <div class="card-surface p-5">
              <p class="text-xs font-bold text-inkMuted">Ruang Keluarga</p>
              <p class="text-2xl font-extrabold font-mono text-ink mt-1">${appState.families.length} Keluarga</p>
            </div>
            <div class="card-surface p-5">
              <p class="text-xs font-bold text-inkMuted">Total Catatan Rencana</p>
              <p class="text-2xl font-extrabold font-mono text-ink mt-1">${appState.adminCounts ? appState.adminCounts.checklists : appState.checklists.length} Baris</p>
            </div>
          </div>

          <div class="card-surface overflow-hidden">
            <div class="px-6 py-5 border-b border-hairline flex flex-wrap items-center justify-between gap-2 bg-subtle/60">
              <div>
                <h2 class="text-base font-extrabold text-ink">Katalog Panduan Perawatan Newborn</h2>
                <p class="text-xs text-inkSoft">Setiap panduan yang diterbitkan langsung membantu seluruh keluarga di aplikasi.</p>
              </div>
              <button onclick="openDosDontsFormModal()" class="px-4 py-2 rounded-full bg-brand text-white text-xs font-bold btn-press inline-flex items-center gap-1.5">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Tambah Topik</span>
              </button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="bg-subtle border-b border-hairline text-xs font-mono uppercase text-inkMuted">
                    <th class="py-3.5 px-5">Topik &amp; Kategori</th>
                    <th class="py-3.5 px-5">Ringkasan Panduan</th>
                    <th class="py-3.5 px-5">Sumber Referensi</th>
                    <th class="py-3.5 px-5 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-hairline">
                  ${appState.dosDonts.map(d => `
                    <tr class="hover:bg-subtle/35">
                      <td class="py-4 px-5 align-top max-w-[230px]">
                        <span class="font-mono text-[11px] font-bold text-brand-text bg-pastelLavender px-2.5 py-0.5 rounded-full">${escapeHTML(d.kategori)}</span>
                        <p class="font-bold text-ink mt-1.5 text-sm">${escapeHTML(d.topik)}</p>
                      </td>
                      <td class="py-4 px-5 align-top text-xs space-y-2 max-w-md">
                        <p class="text-sageText"><strong>Dianjurkan:</strong> ${escapeHTML(d.do_text)}</p>
                        <p class="text-roseCalm-text"><strong>Dihindari:</strong> ${escapeHTML(d.dont_text)}</p>
                      </td>
                      <td class="py-4 px-5 align-top">
                        ${d.source_url ? `
                          <a href="${escapeHTML(d.source_url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-pastelBlue text-skyText text-xs font-bold transition hover:opacity-85">
                            <i data-lucide="external-link" class="w-3.5 h-3.5 shrink-0"></i>
                            <span class="truncate max-w-[180px]">${escapeHTML(d.source_title || d.source_url)}</span>
                          </a>
                        ` : '<span class="text-xs text-inkMuted">-</span>'}
                      </td>
                      <td class="py-4 px-5 align-top text-right whitespace-nowrap">
                        <button onclick="openDosDontsFormModal('${d.id}')" title="Sesuaikan" class="p-2 text-inkSoft hover:text-ink hover:bg-subtle rounded-xl">
                          <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deleteDosDontsItem('${d.id}')" title="Hapus" class="p-2 text-inkMuted hover:text-roseCalm-text hover:bg-roseCalm-soft rounded-xl">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="card-surface overflow-hidden">
            <div class="px-6 py-4 border-b border-hairline">
              <h2 class="text-base font-extrabold text-ink">Daftar Anggota &amp; Akun</h2>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="bg-subtle border-b border-hairline text-xs font-mono uppercase text-inkMuted">
                    <th class="py-3.5 px-5">Pengguna</th>
                    <th class="py-3.5 px-5">Email &amp; Kontak</th>
                    <th class="py-3.5 px-5">Peran &amp; Gol. Darah</th>
                    <th class="py-3.5 px-5">Kode Ruang</th>
                    <th class="py-3.5 px-5 text-right">Detail</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-hairline">
                  ${appState.users.map(u => `
                    <tr class="hover:bg-subtle/35">
                      <td class="py-3.5 px-5">
                        <div class="flex items-center gap-3">
                          ${renderUserAvatar(u, 'w-9 h-9', 'text-xs')}
                          <span class="font-bold text-ink">${escapeHTML(u.nama_lengkap)}</span>
                        </div>
                      </td>
                      <td class="py-3.5 px-5">
                        <span class="font-mono text-xs text-inkSoft block">${escapeHTML(u.email)}</span>
                        ${u.no_hp ? `<span class="font-mono text-xs text-inkMuted block">${escapeHTML(u.no_hp)}</span>` : ''}
                      </td>
                      <td class="py-3.5 px-5 text-xs">
                        <span class="font-semibold">${escapeHTML(u.role)} (${escapeHTML(u.family_role)})</span>
                        <span class="ml-1.5 font-mono text-xs font-bold text-roseCalm-text bg-pastelPink px-2 py-0.5 rounded-full">${escapeHTML(u.golongan_darah || '-')}</span>
                      </td>
                      <td class="py-3.5 px-5 font-mono text-xs">${escapeHTML(u.family_id)}</td>
                      <td class="py-3.5 px-5 text-right">
                        <button onclick="openMemberProfileModal('${u.user_id}')" class="px-3.5 py-1.5 rounded-full border border-hairline hover:bg-subtle text-xs font-bold text-ink">
                          Lihat Kartu
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="card-surface overflow-hidden">
            <div class="px-6 py-4 border-b border-hairline">
              <h2 class="text-base font-extrabold text-ink">Catatan Aktivitas Terbaru</h2>
            </div>
            <div class="divide-y divide-hairline text-xs">
              ${appState.logs.map(l => `
                <div class="px-6 py-3.5 flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-3">
                    <span class="font-mono px-2.5 py-1 rounded-full bg-pastelLavender text-brand-text font-bold">${escapeHTML(l.action)}</span>
                    <span class="text-ink font-bold">${escapeHTML(l.user)}</span>
                    <span class="text-inkSoft">— ${escapeHTML(l.detail)}</span>
                  </div>
                  <span class="text-inkMuted font-mono">${escapeHTML(l.timestamp)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Boot application: pulihkan sesi dari token, atau tampilkan layar masuk
    bootSession();
  </script>
</body>
</html>
